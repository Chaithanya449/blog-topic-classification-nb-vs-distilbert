# Experiment Configuration for Transformer-Based Blog Classification

experiment_name: "transformer_blog_classification"
seed: 42

data:
  raw_data_path: "blogs.csv"
  text_column: "Data"             # Column to train on (raw text; preprocessing handled by src/data.py)
  label_column: "Labels"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  max_length: 128

model:
  pretrained_model_name: "distilbert-base-uncased"
  num_labels: 20

training:
  output_dir: "saved_models/distilbert_blogs"
  learning_rate: 3.0e-5
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  num_train_epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.1
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "macro_f1"
  greater_is_better: true
  logging_steps: 25
  save_total_limit: 1
  fp16: false

baseline:
  max_features: 5000
  alpha: 1.0

artifacts:
  output_dir: "artifacts"

